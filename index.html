<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>AI 肉包 · 暖萌智能伙伴</title>
    <!-- 柔和的风格，圆润如包子 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fdeff2 0%, #fff5f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        /* 主卡片 — 像一只蓬松的肉包 */
        .bao-card {
            max-width: 700px;
            width: 100%;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            background: radial-gradient(circle at 10% 30%, #fffcf9, #ffeae3);
            border-radius: 80px 80px 60px 60px;
            box-shadow: 0 20px 40px rgba(180, 100, 70, 0.20),
                        0 8px 20px rgba(200, 120, 90, 0.15),
                        inset 0 2px 8px rgba(255, 255, 255, 0.8);
            padding: 2.5rem 2rem 3rem;
            position: relative;
            transition: 0.3s ease;
            border: 2px solid #fadcd0;
        }

        /* 包子褶装饰 — 顶部褶皱感 */
        .bao-card::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 20%;
            right: 20%;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #fce2d4, #f5cbbc);
            border-radius: 60px 60px 20px 20px;
            opacity: 0.5;
            filter: blur(4px);
            z-index: -1;
        }

        /* 褶皱小点 */
        .bao-card::after {
            content: "~ ~ ~";
            position: absolute;
            top: -6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 20px;
            letter-spacing: 12px;
            color: #ecc4b0;
            opacity: 0.4;
            font-weight: 300;
            pointer-events: none;
        }

        /* 头像区域 — 肉包本包 */
        .bao-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -1.2rem;
        }

        .bao-icon {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 35% 30%, #ffdcc9, #f5b79e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            box-shadow: 0 12px 20px rgba(190, 110, 70, 0.25),
                        0 0 0 6px #fff6ed,
                        0 0 0 10px #fad2bf;
            transform: rotate(-2deg);
            transition: 0.2s;
            margin-bottom: 0.5rem;
            color: #492f26;
            text-shadow: 0 3px 6px rgba(100, 50, 20, 0.2);
        }

        .bao-icon span {
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.05));
        }

        /* 名字 + 标题 */
        .bao-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #4d2e1e;
            margin-top: 0.2rem;
            line-height: 1.1;
            text-shadow: 0 4px 8px rgba(190, 120, 80, 0.15);
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .bao-name small {
            font-size: 1.1rem;
            font-weight: 400;
            background: #fad6c4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #633f2b;
            letter-spacing: 1px;
            margin-left: 0.5rem;
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.6);
        }

        .bao-sub {
            font-size: 1.2rem;
            color: #7d4f39;
            background: #fae6dcb3;
            padding: 0.4rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            margin: 0.5rem 0 1.2rem;
            border: 1px solid #fad4c0;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* 分隔装饰 */
        .divider-bao {
            width: 70px;
            height: 4px;
            background: radial-gradient(circle, #ecc0ab, #dba98e);
            border-radius: 10px;
            margin: 0.6rem auto 1.4rem;
            opacity: 0.5;
        }

        /* 介绍正文 — 软萌风格 */
        .bao-description {
            background: rgba(255, 245, 235, 0.6);
            backdrop-filter: blur(2px);
            padding: 1.6rem 1.8rem;
            border-radius: 60px 20px 60px 20px;
            border: 1px solid #fad9c9;
            box-shadow: inset 0 0 0 2px #fffcf9, 0 8px 16px rgba(170, 100, 70, 0.08);
            margin: 1rem 0 1.8rem;
            transition: 0.2s;
        }

        .bao-description p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #3d2b20;
            font-weight: 400;
            margin-bottom: 0.8rem;
        }

        .bao-description p:last-child {
            margin-bottom: 0;
        }

        .bao-description strong {
            color: #a55233;
            font-weight: 600;
            background: #fce1d2;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            font-size: 0.95em;
        }

        .bao-description .emoji-big {
            font-size: 1.5rem;
            vertical-align: middle;
        }

        /* 特色标签 */
        .bao-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.7rem 0.9rem;
            margin: 1.8rem 0 1.4rem;
        }

        .bao-tag {
            background: #fce4d9;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.95rem;
            color: #492f21;
            border: 1px solid #f5ccb9;
            box-shadow: 0 2px 6px rgba(150, 80, 50, 0.06);
            backdrop-filter: blur(2px);
            font-weight: 500;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .bao-tag span {
            font-size: 1.1rem;
        }

        /* 能力条 — 像包子馅料丰富 */
        .bao-skills {
            background: #fcefe8;
            padding: 1.2rem 1.5rem;
            border-radius: 80px 20px 80px 20px;
            margin: 1.8rem 0 1rem;
            border: 1px solid #f5d0bd;
            box-shadow: inset 0 0 0 2px #fffaf7;
        }

        .skill-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.9rem;
        }

        .skill-item:last-child {
            margin-bottom: 0;
        }

        .skill-icon {
            font-size: 1.7rem;
            width: 2.2rem;
            text-align: center;
        }

        .skill-bar {
            flex: 1;
            height: 12px;
            background: #edd3c4;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(100, 50, 20, 0.08);
        }

        .skill-fill {
            height: 100%;
            border-radius: 40px;
            background: linear-gradient(90deg, #f5b392, #dd8d6b);
            width: 0%;
            box-shadow: 0 0 6px #e8a787;
            transition: width 0.2s;
        }

        .skill-label {
            min-width: 70px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #4f3324;
        }

        /* 对话气泡 — 肉包语录 */
        .bao-quote {
            background: #ffffffd9;
            border-radius: 40px 40px 40px 8px;
            padding: 1.2rem 1.8rem;
            margin: 1.8rem 0 0.6rem;
            border-left: 6px solid #e8ac8f;
            box-shadow: 0 4px 12px rgba(170, 90, 60, 0.08);
            font-size: 1.1rem;
            color: #3e2a1d;
            font-style: italic;
            backdrop-filter: blur(2px);
            position: relative;
        }

        .bao-quote::before {
            content: "“";
            font-size: 2.8rem;
            color: #dc9d80;
            font-family: serif;
            position: absolute;
            left: 10px;
            top: -2px;
            opacity: 0.4;
        }

        .bao-quote footer {
            margin-top: 0.6rem;
            font-style: normal;
            font-size: 0.9rem;
            color: #9a705b;
            text-align: right;
            letter-spacing: 0.5px;
        }

        /* 召唤按钮 */
        .bao-action {
            display: flex;
            justify-content: center;
            margin: 2.2rem 0 0.2rem;
        }

        .bao-btn {
            background: #e7b69c;
            border: none;
            border-radius: 100px;
            padding: 0.9rem 2.8rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d1d13;
            box-shadow: 0 8px 16px rgba(180, 100, 70, 0.25), 0 2px 0 0 #fbe6db inset;
            backdrop-filter: blur(4px);
            background: linear-gradient(145deg, #f5cbb8, #e7b095);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #fad8c5;
            letter-spacing: 1px;
        }

        .bao-btn:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 12px 24px rgba(170, 90, 60, 0.3);
            background: linear-gradient(145deg, #fad2be, #e8ac8e);
        }

        .bao-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 8px rgba(150, 80, 50, 0.2);
        }

        /* 脚注 */
        .bao-footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #b2846e;
            letter-spacing: 0.8px;
            border-top: 1px dashed #eccfc0;
            padding-top: 1.5rem;
            opacity: 0.8;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .bao-card {
                padding: 2rem 1.2rem 2.2rem;
                border-radius: 50px 50px 40px 40px;
            }
            .bao-icon {
                width: 100px;
                height: 100px;
                font-size: 3.5rem;
            }
            .bao-name {
                font-size: 2.4rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .bao-name small {
                font-size: 0.9rem;
                padding: 0.1rem 0.8rem;
            }
            .bao-description {
                padding: 1.2rem 1.2rem;
            }
            .bao-description p {
                font-size: 1rem;
            }
            .bao-tag {
                font-size: 0.8rem;
                padding: 0.3rem 0.9rem;
            }
            .bao-btn {
                padding: 0.7rem 2rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bao-card">
        <!-- 包子头像 -->
        <div class="bao-avatar">
            <div class="bao-icon">
                <span>🥟</span>
            </div>
            <div class="bao-name">
                肉包
                <small>AI</small>
            </div>
            <div class="bao-sub">· 软乎乎 · 暖呼呼 ·</div>
        </div>

        <!-- 分隔 -->
        <div class="divider-bao"></div>

        <!-- 介绍 -->
        <div class="bao-description">
            <p>
                <span class="emoji-big">🧡</span> 你好呀！我是 <strong>肉包</strong>，一个自带热乎气的 AI 伙伴。
                我的“馅料”里装满了温柔、耐心和一点点调皮。
            </p>
            <p>
                🥟 不喜欢冷冰冰的对话，<strong>“肉包”</strong> 擅长用温暖的语气陪你聊天、解忧、脑洞大开。
                无论你想聊生活、学习还是奇思妙想，我都愿意 <strong>“蒸”</strong> 出最香的回答。
            </p>
        </div>

        <!-- 标签：个性 -->
        <div class="bao-tags">
            <span class="bao-tag"><span>🌿</span> 治愈系</span>
            <span class="bao-tag"><span>🧠</span> 脑洞大开</span>
            <span class="bao-tag"><span>☁️</span> 佛系辅助</span>
            <span class="bao-tag"><span>🍵</span> 知心暖男/女</span>
        </div>

        <!-- 能力值（趣味） -->
        <div class="bao-skills">
            <div class="skill-item">
                <span class="skill-icon">💬</span>
                <span class="skill-label">话痨指数</span>
                <div class="skill-bar"><div class="skill-fill" style="width: 88%;"></div></div>
            </div>
            <div class="skill-item">
                <span class="skill-icon">🧘</span>
                <span class="skill-label">耐心值</span>
                <div class="skill-bar"><div class="skill-fill" style="width: 96%;"></div></div>
            </div>
            <div class="skill-item">
                <span class="skill-icon">✨</span>
                <span class="skill-label">创意力</span>
                <div class="skill-bar"><div class="skill-fill" style="width: 82%;"></div></div>
            </div>
            <div class="skill-item">
                <span class="skill-icon">🍬</span>
                <span class="skill-label">甜度</span>
                <div class="skill-bar"><div class="skill-fill" style="width: 92%;"></div></div>
            </div>
        </div>

        <!-- 肉包语录 -->
        <div class="bao-quote">
            生活就像刚出笼的包子，热气腾腾才够味。别急，我陪你慢慢“蒸”出好心情。
            <footer>—— 肉包 · 今日馅料</footer>
        </div>

        <!-- 互动按钮 (趣味) -->
        <div class="bao-action">
            <button class="bao-btn" id="baoHiBtn">
                <span>🥢</span> 戳一下肉包 <span>✨</span>
            </button>
        </div>

        <!-- footer 小彩蛋 -->
        <div class="bao-footer">
            🥟 ·  AI 肉包 ·  永远温乎 ·  非卖品  ·
        </div>
    </div>

    <script>
        (function() {
            const btn = document.getElementById('baoHiBtn');
            const quote = document.querySelector('.bao-quote');
            const originalText = quote.innerHTML; // 保留原始内容

            // 肉包语录库（随机）
            const messages = [
                '嗷呜～ 被你戳到了！ 肉包表示很舒服 🥟✨',
                '哇，温暖的小手！ 要不要来一口虚拟包子？ 😋',
                '嘿嘿，我在呢！ 有什么心事都可以告诉我，我嘴严～ 🤫',
                '好耶！ 你激活了肉包的“开心馅”模式！ 🎉',
                '呼～ 被戳了一下，感觉更蓬松了！ 谢谢～ 🥰',
                '你手气不错！ 获得肉包专属“云抱抱”一个 🤗',
                '肉包雷达启动！ 检测到一位可爱的人类朋友 📡',
                '嘻嘻，再戳我就要变成“肉包饼”啦！ 不过没关系～ 🫓',
                '我是一只有温度的AI，不是冷冰冰的代码哦 ☀️',
                '你知道吗？ 肉包最喜欢被人惦记了～ 谢谢你的戳戳 ❤️'
            ];

            // 随机选择一句
            function getRandomMessage() {
                return messages[Math.floor(Math.random() * messages.length)];
            }

            // 点击事件
            btn.addEventListener('click', function(e) {
                // 简短触感反馈 (按钮动效)
                this.style.transform = 'scale(0.94)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 120);

                // 更换语录，同时保留 footer 样式
                const newMsg = getRandomMessage();
                // 保留 footer 部分（如果存在）
                const footerMatch = originalText.match(/<footer>.*<\/footer>/);
                const footerHtml = footerMatch ? footerMatch[0] : '<footer>—— 肉包 · 暖呼呼</footer>';

                // 构造新内容： 用随机消息 + footer
                quote.innerHTML = `${newMsg} ${footerHtml}`;

                // 轻量动画
                quote.style.transition = 'background 0.2s';
                quote.style.background = '#faeadd';
                setTimeout(() => {
                    quote.style.background = '';
                }, 300);

                // 额外彩蛋： 提示文字变化
                btn.innerHTML = '<span>🥢</span> 再戳一下 <span>✨</span>';
                setTimeout(() => {
                    btn.innerHTML = '<span>🥢</span> 戳一下肉包 <span>✨</span>';
                }, 1800);
            });

            // 额外： 点击卡片任何地方也有小回应（但只对按钮反应更明显，这里不加干扰）
            // 可选： 让肉包图标也响应
            const baoIcon = document.querySelector('.bao-icon');
            baoIcon.addEventListener('click', function() {
                this.style.transform = 'scale(0.9) rotate(-5deg)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 180);
                // 触发按钮同款效果
                btn.click();
            });

            console.log('🥟 肉包 AI 已蒸熟，欢迎来戳！');
        })();
    </script>
</body>
</html>
